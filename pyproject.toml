[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgman"
version = "2.2.12"
description = "Declarative layer over OS package managers. Replay your manually installed packages on fresh machines."
requires-python = ">=3.11"
authors = [{name = "Jose"}]
license = {text = "MIT"}

[project.scripts]
pkgman = "pkgman:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["pkgman"]

[dependency-groups]
dev = ["pytest"]